services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equalizador-app
    restart: unless-stopped
    volumes:
      # Persist inventory JSON so updates inside the container survive restarts
      - ./inventario_geral_maquinas.json:/app/inventario_geral_maquinas.json
    environment:
      - NODE_ENV=production
    # Enable host network so the container binds to the WSL IP directly
    network_mode: host
